name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare engine on JitPack
        run: |
          set +e
          POM=https://jitpack.io/com/github/MohammadMaaitah-afk/LibretroDroid/4e0b88bcc3/LibretroDroid-4e0b88bcc3.pom
          for i in $(seq 1 40); do
            curl -sf -m 120 -o /dev/null "$POM" && { echo ready; exit 0; }
            echo "waiting for JitPack ($i)"; sleep 30
          done
          curl -s -m 60 https://jitpack.io/com/github/MohammadMaaitah-afk/LibretroDroid/4e0b88bcc3/build.log | tail -100
          exit 1

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDynamicRelease

      - name: Rename APK
        run: cp lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk LegendsArena.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: LegendsArena.apk

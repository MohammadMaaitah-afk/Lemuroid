name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare engine on JitPack
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://jitpack.io/com/github/MohammadMaaitah-afk/LibretroDroid/4e0b88bcc3/build.log)
            curl -s -o /dev/null https://jitpack.io/com/github/MohammadMaaitah-afk/LibretroDroid/4e0b88bcc3/LibretroDroid-4e0b88bcc3.pom || true
            if curl -sf -o /dev/null https://jitpack.io/com/github/MohammadMaaitah-afk/LibretroDroid/4e0b88bcc3/LibretroDroid-4e0b88bcc3.pom; then echo ready; exit 0; fi
            echo "waiting ($code)"; sleep 30
          done
          curl -s https://jitpack.io/com/github/MohammadMaaitah-afk/LibretroDroid/4e0b88bcc3/build.log | tail -80
          exit 1

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDynamicRelease

      - name: Rename APK
        run: cp lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk LegendsArena.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: LegendsArena.apk
